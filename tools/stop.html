<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop test bench</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/track.css">
<style>
  body { font-size: 15px; }
  .bench { display: grid; gap: 18px; max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .bench h1 { margin: 0; font: 700 22px var(--display); }
  .bench h2 { margin: 0 0 10px; font: 600 16px var(--display); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); }
  .controls label { display: inline-flex; align-items: center; gap: 6px; }
  .controls output { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--gold); }
  .controls input[type="range"] { width: 160px; }
  .controls .wide input[type="range"] { width: 300px; }
  .controls fieldset { display: inline-flex; gap: 10px; margin: 0; padding: 0; border: 0; }
  .controls legend { float: left; margin-right: 6px; color: var(--muted); }
  .controls select, .controls button { font: 600 14px var(--display); padding: 6px 10px; border-radius: 8px; border: 0; background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
  .controls button.primary { background: var(--gold); color: var(--ink); box-shadow: none; }
  .panel { padding: 14px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); }
  .readout { margin: 0 0 10px; font: 500 14px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }
  /* the stage: the page colour, room above and below for him to step in and out */
  .stage { position: relative; overflow: hidden; padding: 60px 0; background: var(--night); border-radius: 10px; }
  .box { position: relative; margin: 0 auto; }
  .core { position: absolute; top: 0; bottom: 0; outline: 1px dashed rgba(255, 79, 216, 0.8); pointer-events: none; }
  .stage.no-core .core { display: none; }
  .results { margin: 0; padding-left: 20px; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  .results .bad { color: #ff8f7f; }
  .results .note { color: var(--gold); }
  .results .good { color: var(--green); }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="bench">
  <h1>Stop test bench <span class="hint" id="title"></span></h1>

  <form class="controls" id="controls" onsubmit="return false">
    <label>Stop <select id="stop"></select></label>
    <label>Width <input type="range" id="w" min="160" max="240" step="2" value="200"> <output id="w-out"></output></label>
    <label class="wide">p <input type="range" id="p" min="0" max="1" step="0.001" value="0.35"> <output id="p-out"></output></label>
    <fieldset><legend>He is</legend>
      <label><input type="radio" name="state" value="here" checked> here</label>
      <label><input type="radio" name="state" value="before"> not yet (before)</label>
      <label><input type="radio" name="state" value="after"> gone (after)</label>
    </fieldset>
    <fieldset><legend>Scale</legend>
      <label><input type="radio" name="gp" value="2"> phone 2</label>
      <label><input type="radio" name="gp" value="2.5"> tablet 2.5</label>
      <label><input type="radio" name="gp" value="3" checked> desktop 3</label>
    </fieldset>
    <label><input type="checkbox" id="reduced"> Reduced motion</label>
    <label><input type="checkbox" id="up"> Scrolling up</label>
    <label><input type="checkbox" id="still"> Not scrolling</label>
    <label><input type="checkbox" id="idle"> Idle clock (hold)</label>
    <label><input type="checkbox" id="core" checked> 160 core</label>
    <button type="button" id="play">Play down and back ▶</button>
    <button type="button" class="primary" id="check">Run checks</button>
  </form>

  <section class="panel">
    <h2>Scene</h2>
    <p class="readout" id="readout"></p>
    <div class="stage" id="stage">
      <div class="box" id="box">
        <canvas class="tl-canvas" id="scene" aria-hidden="true"></canvas>
        <div class="tl-labels" id="labels" aria-hidden="true"></div>
        <div class="core" id="corebox"></div>
      </div>
      <canvas class="tl-canvas tl-hero" id="hero" aria-hidden="true"></canvas>
    </div>
  </section>

  <section class="panel">
    <h2>Move to the next stop</h2>
    <div class="controls">
      <label class="wide">s <input type="range" id="s" min="0" max="1" step="0.001" value="0.4"> <output id="s-out"></output></label>
      <label>Height <input type="range" id="th" min="60" max="320" step="2" value="180"> <output id="th-out"></output></label>
      <span class="hint" id="transit-kind"></span>
    </div>
    <div class="stage" id="tstage">
      <div class="box" id="tbox"><canvas class="tl-canvas" id="tcanvas" aria-hidden="true"></canvas></div>
      <canvas class="tl-canvas tl-hero" id="thero" aria-hidden="true"></canvas>
    </div>
  </section>

  <section class="panel">
    <h2>Checks</h2>
    <ul class="results" id="results"><li>Press “Run checks”.</li></ul>
    <p class="hint">Also: determinism means the same p always draws the same pixels, whatever you scrolled through before. URL parameters: ?stop=, &w=, &p=, &gp=, &reduced=1.</p>
  </section>
</div>
<script type="module" src="stop.js"></script>
</body>
</html>
